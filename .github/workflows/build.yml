name: Package PXE deployment bundle

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_config.py
      - name: Generate and verify template bundle
        run: |
          bundle="nvidia-b300-pxe-${GITHUB_REF_NAME}"
          version="$(python -c 'import yaml; print(yaml.safe_load(open("config/versions.yml"))["artifact_version"])')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python scripts/prepare_pxe.py --template --artifact-version "$version" --output "artifacts/$bundle"
          (cd "artifacts/$bundle" && sha256sum -c SHA256SUMS)
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C artifacts -cf - "$bundle" | gzip -n > "artifacts/$bundle.tar.gz"
          sha256sum "artifacts/$bundle.tar.gz" > "artifacts/$bundle.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-b300-pxe-${{ github.ref_name }}
          path: artifacts/nvidia-b300-pxe-${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "artifacts/nvidia-b300-pxe-${GITHUB_REF_NAME}.tar.gz" "artifacts/nvidia-b300-pxe-${GITHUB_REF_NAME}.tar.gz.sha256" --generate-notes
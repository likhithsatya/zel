name: Build Packer B300 QEMU image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qcow2:
    runs-on: [self-hosted, linux, x64, image-builder]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_config.py
      - run: python -m unittest discover -s tests -v
      - run: packer version
      - run: make packer-qemu-validate
      - run: make packer-qemu
      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-b300-ubuntu-24.04.3-r620-qemu
          path: artifacts/packer-qemu-b300/*
          if-no-files-found: error
          retention-days: 30
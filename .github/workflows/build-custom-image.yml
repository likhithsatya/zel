name: Build custom Ubuntu B300 installer ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "custom-v*"

permissions:
  contents: write

jobs:
  build-custom-iso:
    runs-on: [self-hosted, linux, x64, image-builder]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_config.py
      - run: bash -n scripts/*.sh drivers/*.sh
      - run: python -m unittest discover -s tests -v
      - run: make report
      - run: make custom-iso
      - run: make smoke-custom-iso
      - run: bash scripts/split-release-iso.sh artifacts/nvidia-b300-ubuntu-24.04.3-r620.iso artifacts/release-assets
      - run: cp docs/B300-CUSTOM-OS-V1-REPORT.md docs/B300-CUSTOM-OS-V1-REPORT.pdf artifacts/release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: nvidia-b300-ubuntu-24.04.3-r620
          path: artifacts/release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged ISO
        if: startsWith(github.ref, 'refs/tags/custom-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/release-assets/* --generate-notes